name: Deploy intentsolutions.io to VPS

# Push to main → CI → Tailscale OIDC → SSH to intentsolutions VPS →
# /usr/local/sbin/deploy-intentsolutions force-command does
# git fetch + npm ci + astro build + atomic rsync to /srv/intentsolutions/dist.
#
# Replaces firebase-deploy.yml (disabled). See VPS-as-the-home Priority 7
# Stage C and intent-solutions-io/intent-os/ops/deploy (D90).

on:
  push:
    branches: [main]
    paths:
      - 'astro-site/**'
      - '.github/workflows/deploy-vps.yml'
  pull_request:
    branches: [main]
    paths:
      - 'astro-site/**'
      - '.github/workflows/deploy-vps.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write   # required for Tailscale OIDC

concurrency:
  group: deploy-vps-${{ github.repository }}
  cancel-in-progress: false

jobs:
  test:
    name: pre-deploy gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: astro-site
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Refresh receipts from their live sources
        # Every number on the homepage renders from src/data/receipts.json with a
        # verified_at date. The committed file is the fallback when a source is
        # unreachable; the check below fails the deploy if any value is older
        # than 7 days. See scripts/refresh-receipts.mjs.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run receipts && npm run receipts:check

      - name: Build Astro site
        run: npm run build

      - name: Copy gate
        # Fails the deploy if the built HTML carries a retired string, a dollar
        # figure, an em or en dash, a hand-typed count, or a banned pairing.
        # List: astro-site/brand/voice-profile.md; script: scripts/check-copy.mjs.
        run: npm run check:copy

      - name: Indexability regression guard
        # Asserts sitemap/canonical/title/robots/404 invariants from
        # 000-docs search-console-indexing-audit. Fails the deploy if a change
        # reintroduces soft-404s, off-domain canonicals in the sitemap, or
        # duplicate titles. See scripts/audit-indexability.mjs.
        run: npm run audit:indexability

      - name: Verify build artifacts
        run: |
          test -f dist/index.html
          test -f dist/healthz
          # Defensive line-length cap — Astro emits some long inline runtime
          # bundles that legitimately push past 5000 chars. We cap at 50k as a
          # blow-up guardrail; tonsofskills uses 5000 because it has no React
          # islands on the homepage. Adjust if Astro's bundle grows.
          MAX_LINE=$(wc -L dist/index.html | awk '{print $1}')
          if [ "$MAX_LINE" -gt 50000 ]; then
            echo "ERROR: HTML line too long ($MAX_LINE chars)."
            exit 1
          fi
          echo "build artifacts present (max line: $MAX_LINE chars)"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end specs against the built artifact
        # tests/e2e/home.spec.ts (headline, doors, receipts, copy, analytics,
        # focus, reduced motion) and redirects.spec.ts (removed routes gone,
        # kept routes build, healthz). Runs astro preview on dist.
        run: npx playwright test --project=chromium

  deploy:
    # The gate job runs on pull requests too; only a push to main deploys.
    if: github.event_name != 'pull_request'
    needs: test
    uses: jeremylongshore/.github/.github/workflows/vps-deploy.yml@53d6be37d6c046818157b954acb33667ac095dd8
    with:
      variant: static
      srv-path: /srv/intentsolutions
      health-check-url: https://intentsolutions.io/healthz
      vps-tailnet-ip: 100.88.144.55
      vps-public-ip: 167.86.106.29
      vps-host: intentsolutions
      vps-user: intentsolutions
      smoke-validation: '.ok == true'
    secrets:
      TS_OIDC_CLIENT_ID: ${{ secrets.TS_OIDC_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
      VPS_DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_KEY }}
      VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
